services:
  edr-console:
    image: hjkworld/edr-console:0.1.0
    build: .
    container_name: edr-console
    restart: unless-stopped
    # Lab: the Wazuh indexer listens on 127.0.0.1 only and target hosts are reached over the
    # host's tailnet, so the container shares the host network. For a bridged deployment see
    # docker-compose.bridge.yml.
    network_mode: host
    env_file: .env
    volumes:
      - edr-console-data:/app/data
      - ./secrets:/app/secrets:ro
      # EDR-130: signed Windows add-on (installer/windows/build-addon.sh --out ./addon); goes into the Windows agent pack
      - ./addon:/app/addon:ro
      # EDR-149: requests to the root helper on the host (installer/modules/62-host-bridge.sh), e.g. join the tailnet
      - /var/lib/mamorai/host-bridge:/app/host-bridge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # EDR-89: logs go to the host journal with a fixed identifier, so Wazuh (journald localfile, decoder "mamorai")
    # keeps reading them when the container is recreated (the json-file path contains the container ID).
    logging:
      driver: journald
      options:
        tag: mamorai

volumes:
  edr-console-data:
